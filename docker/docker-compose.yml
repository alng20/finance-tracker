services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=${POSTGRES_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__SecretKey: ${JWT_SECRET_KEY}
    networks:
      - finance_tracker
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "${HTTP_PORT:-5173}:80"
      - "${HTTPS_PORT:-5443}:443"
    networks:
      - finance_tracker
    volumes:
      - ${TLS_CERTS_PATH:-./out/certs}:/etc/nginx/certs/
    depends_on:
      api:
        condition: service_started

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - finance_tracker
    ports:
      - "6000:${POSTGRES_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d FinanceTracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  finance_tracker:
    ipam:
      config:
        - subnet: 172.20.0.0/16

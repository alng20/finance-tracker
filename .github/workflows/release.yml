name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        run: |
          docker build \
            -f docker/api.Dockerfile \
            -t ghcr.io/${{ github.repository_owner }}/finance-tracker-api:${{ steps.version.outputs.version }} \
            .

          docker push \
            ghcr.io/${{ github.repository_owner }}/finance-tracker-api:${{ steps.version.outputs.version }}

          docker build \
            -f docker/frontend.Dockerfile \
            -t ghcr.io/${{ github.repository_owner }}/finance-tracker-frontend:${{ steps.version.outputs.version }} \
            .

          docker push \
            ghcr.io/${{ github.repository_owner }}/finance-tracker-frontend:${{ steps.version.outputs.version }}

      - name: Create deployment package
        run: |
          mkdir release

          cp deploy/docker-compose.deploy.yml release/
          cp deploy/deploy_app release/
          cp deploy/stop_app release/
          cp deploy/.env.example release/

          sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ steps.version.outputs.version }}/" release/.env.example

          cd release
          zip -r ../finance-tracker-release-${{ github.ref_name }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Finance Tracker ${{ github.ref_name }}
          generate_release_notes: true
          files: finance-tracker-release-${{ github.ref_name }}.zip

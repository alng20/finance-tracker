name: Push PR Images

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit SHA to build and push"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  docker:
    uses: ./.github/workflows/docker-images.yml
    with:
      ref: ${{ inputs.ref }}
      push: true

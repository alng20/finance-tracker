name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  dotnet-build-and-test:
    runs-on: ubuntu-latest

    env:
      Jwt__SecretKey: ${{ secrets.JWT_SECRET_KEY }}

    strategy:
      matrix:
        configuration:
          - Debug
          - Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration ${{ matrix.configuration }}

      - name: Test
        run: dotnet test --no-build --configuration ${{ matrix.configuration }}

  docker-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -f docker/api.Dockerfile \
            -t ghcr.io/${{ github.repository_owner }}/finance-tracker-api:latest \
            -t ghcr.io/${{ github.repository_owner }}/finance-tracker-api:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/finance-tracker-api:latest
          docker push ghcr.io/${{ github.repository_owner }}/finance-tracker-api:${{ github.sha }}

  frontend-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check formatting
        working-directory: frontend
        run: npm run format:check

      - name: Run Lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  frontend-docker-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -f docker/frontend.Dockerfile \
            -t ghcr.io/${{ github.repository_owner }}/finance-tracker-frontend:latest \
            -t ghcr.io/${{ github.repository_owner }}/finance-tracker-frontend:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/finance-tracker-frontend:latest
          docker push ghcr.io/${{ github.repository_owner }}/finance-tracker-frontend:${{ github.sha }}

name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or Branch"
        required: true
        type: string
      postfix:
        description: "Postfix for docker image"
        required: true
        type: string

jobs:
  api-build-and-test:
    runs-on: ubuntu-latest

    env:
      Jwt__SecretKey: ${{ secrets.JWT_SECRET_KEY }}

    strategy:
      matrix:
        configuration:
          - Debug
          - Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Set short SHA
        run: echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> $GITHUB_ENV

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration ${{ matrix.configuration }}

      - name: Test
        run: dotnet test --no-build --configuration ${{ matrix.configuration }}

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set short SHA
        run: echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check formatting
        working-directory: frontend
        run: npm run format:check

      - name: Run Lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  api-docker-image:
    needs: api-build-and-test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -f docker/api.Dockerfile \
            -t ghcr.io/${{ github.repository_owner }}/finance-tracker-api:${{ github.sha }} \
            .

      - name: Tag latest
        if: github.event_name == 'push'
        run: |
          docker tag \
            ghcr.io/${{ github.repository_owner }}/finance-tracker-api:${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/finance-tracker-api:latest

      - name: Tag PR image
        if: github.event_name == 'workflow_dispatch'
        run: |
          docker tag \
            ghcr.io/${{ github.repository_owner }}/finance-tracker-api:${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/finance-tracker-api:pr-${{inputs.postfix}}-${{ env.SHORT_SHA }}

      - name: Push main image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/finance-tracker-api:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/finance-tracker-api:latest

      - name: Push PR image
        if: github.event_name == 'workflow_dispatch'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/finance-tracker-api:pr-${{inputs.postfix}}-${{ env.SHORT_SHA }}

  frontend-docker-image:
    needs: frontend-build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -f docker/frontend.Dockerfile \
            -t ghcr.io/${{ github.repository_owner }}/finance-tracker-frontend:${{ github.sha }} \
            .

      - name: Tag latest
        if: github.event_name == 'push'
        run: |
          docker tag \
            ghcr.io/${{ github.repository_owner }}/finance-tracker-frontend:${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/finance-tracker-frontend:latest

      - name: Tag PR image
        if: github.event_name == 'workflow_dispatch'
        run: |
          docker tag \
            ghcr.io/${{ github.repository_owner }}/finance-tracker-frontend:${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/finance-tracker-frontend:pr-${{inputs.postfix}}-${{ env.SHORT_SHA }}

      - name: Push main image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/finance-tracker-frontend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/finance-tracker-frontend:latest

      - name: Push PR image
        if: github.event_name == 'workflow_dispatch'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/finance-tracker-frontend:pr-${{inputs.postfix}}-${{ env.SHORT_SHA }}
